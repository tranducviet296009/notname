<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Thu Trọn Vẹn Cùng Em</title>
    <!-- Nạp Tailwind CSS để dựng layout nhanh -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Nạp Google Fonts: Dancing Script cho thơ, Quicksand cho văn xuôi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Vô hiệu hóa cuộn trang ngoài cùng */
            background: radial-gradient(circle at 50% 100%, #1a0b2e 0%, #020111 60%, #000000 100%);
            color: #ffffff;
            font-family: 'Quicksand', sans-serif;
            height: 100vh;
            width: 100vw;
        }

        .font-dancing { font-family: 'Dancing Script', cursive; }
        .font-quicksand { font-family: 'Quicksand', sans-serif; }

        @keyframes pulseMoon {
            0% { box-shadow: 0 0 50px 15px rgba(253, 224, 71, 0.5), inset 0 0 30px rgba(0,0,0,0.2); transform: scale(1); }
            100% { box-shadow: 0 0 100px 30px rgba(253, 224, 71, 0.8), inset 0 0 30px rgba(0,0,0,0.2); transform: scale(1.02); }
        }
        .moon {
            background: radial-gradient(circle at 35% 35%, #fffde4, #fde047, #ca8a04);
            animation: pulseMoon 4s infinite alternate ease-in-out;
            cursor: pointer;
            transition: all 0.5s ease;
            position: relative;
            z-index: 40;
        }
        .moon:hover { filter: brightness(1.2); }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite alternate ease-in-out;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 8px #fff; }
        }

        .lantern-container {
            position: absolute;
            bottom: -150px;
            animation: floatUp var(--float-duration) linear infinite;
        }
        .lantern-sway {
            animation: sway var(--sway-duration) ease-in-out infinite alternate;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(var(--scale)); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-120vh) scale(var(--scale)); opacity: 0; }
        }
        @keyframes sway {
            0% { transform: translateX(-20px) rotate(-8deg); }
            100% { transform: translateX(20px) rotate(8deg); }
        }
        .lantern-glow { filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.9)); }

        #love-modal {
            backdrop-filter: blur(12px);
            background-color: rgba(0, 0, 0, 0.6);
            transition: opacity 0.8s ease;
        }
        
        #modal-content {
            scrollbar-width: thin;
            scrollbar-color: #fde047 transparent;
            mask-image: linear-gradient(to bottom, transparent, black 2%, black 98%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 2%, black 98%, transparent);
        }
        #modal-content::-webkit-scrollbar { width: 6px; }
        #modal-content::-webkit-scrollbar-track { background: transparent; }
        #modal-content::-webkit-scrollbar-thumb { background: #fde047; border-radius: 10px; }

        .neon-poem {
            color: #fef08a; /* Vàng nhạt */
            text-shadow: 0 0 5px rgba(253, 224, 71, 0.6), 0 0 15px rgba(234, 179, 8, 0.4);
        }
        
        .neon-essay {
            color: #fce7f3; /* Hồng nhạt */
            text-shadow: 0 0 4px rgba(244, 114, 182, 0.6), 0 0 12px rgba(219, 39, 119, 0.4);
        }

        /* Animation xuất hiện mượt mà cho từng đoạn văn */
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s forwards ease-out;
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .flash-neon-box {
            border: 4px solid #fff;
            box-shadow: 
                0 0 10px #ff00de,
                inset 0 0 10px #ff00de,
                0 0 20px #ff00de,
                inset 0 0 20px #ff00de,
                0 0 40px #ff00de;
            animation: boxPulsate 1.5s infinite alternate;
            background: rgba(255, 0, 222, 0.1);
        }
        .flash-neon-text {
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #ff00de,
                0 0 20px #ff00de,
                0 0 40px #ff00de,
                0 0 80px #ff00de;
            animation: textFlicker 2s infinite alternate;
        }

        @keyframes boxPulsate {
            0% { box-shadow: 0 0 10px #ff00de, inset 0 0 10px #ff00de; border-color: #ffb3f0; }
            100% { box-shadow: 0 0 30px #ff00de, inset 0 0 30px #ff00de, 0 0 60px #ff00de; border-color: #fff; }
        }
        @keyframes textFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; text-shadow: 0 0 5px #fff, 0 0 10px #ff00de; }
        }

    </style>
</head>

<body class="relative flex flex-col items-center justify-center">

    <audio id="bgMusic" loop autoplay>
        <source src="nhac/trungthu.mp3" type="audio/mpeg">
    </audio>

    <!-- Vùng chứa bầu trời sao và đèn lồng -->
    <div id="stars-container" class="absolute inset-0 z-0 pointer-events-none"></div>
    <div id="lanterns-container" class="absolute inset-0 z-10 pointer-events-none overflow-hidden"></div>

    <div id="welcome-screen" class="absolute inset-0 z-30 flex flex-col items-center justify-center text-center px-4 transition-opacity duration-1000">
        <div id="the-moon" class="moon w-40 h-40 md:w-56 md:h-56 rounded-full mb-10" title="Chạm vào mặt trăng đi em!"></div>
        <h1 class="font-dancing text-4xl md:text-6xl text-yellow-300 drop-shadow-[0_0_15px_rgba(253,224,71,0.8)] mb-4 leading-tight">
            Gửi Tình Yêu Của Anh
        </h1>
        <p class="text-gray-300 text-sm md:text-lg italic animate-pulse">
            (Chạm nhẹ vào mặt trăng để bắt đầu nhé...)
        </p>
    </div>

    <div id="love-modal" class="fixed inset-0 z-40 hidden flex-col items-center justify-center px-2 py-4 md:p-6">
        
        <div class="w-full max-w-5xl h-[95vh] relative rounded-3xl flex flex-col bg-transparent">
            
            <!-- Header Modal: Chứa Tiêu đề và Bộ đếm chữ -->
            <div class="flex justify-between items-center p-4 md:px-8 pb-6 border-b border-yellow-500/20">
                <h2 class="font-dancing text-3xl md:text-4xl text-yellow-300 font-bold tracking-wider drop-shadow-[0_0_10px_rgba(253,224,71,0.6)]">
                    Lời Trái Tim
                </h2>
                <!-- Bộ đếm chữ góc trên bên phải -->
                <div class="flex items-center gap-2">
                    <div class="px-4 py-2 rounded-full border border-pink-500/50 bg-pink-900/20 shadow-[0_0_10px_rgba(236,72,153,0.3)] backdrop-blur-sm">
                        <span class="text-sm md:text-base text-pink-200 font-semibold font-quicksand">
                            Words: <span id="word-counter" class="text-white">0</span> / 20000
                        </span>
                    </div>
                </div>
            </div>

            <!-- Body Modal: Nơi chứa nội dung (Infinite Scroll) -->
            <div id="modal-content" class="flex-1 overflow-y-auto px-4 md:px-12 py-8 scroll-smooth">
                <div id="infinite-scroll-container" class="space-y-12 md:space-y-16 max-w-3xl mx-auto pb-20">
                    <!-- Nội dung sẽ được append vào đây -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const starsContainer = document.getElementById('stars-container');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                star.style.width = star.style.height = `${Math.random() * 2.5 + 0.5}px`;
                star.style.setProperty('--duration', `${Math.random() * 4 + 2}s`);
                star.style.animationDelay = `${Math.random() * 5}s`;
                starsContainer.appendChild(star);
            }

            const lanternsContainer = document.getElementById('lanterns-container');
            const lanternSVG = `
                <svg width="45" height="65" viewBox="0 0 50 70" xmlns="http://www.w3.org/2000/svg" class="lantern-glow">
                    <line x1="25" y1="0" x2="25" y2="5" stroke="#FBBF24" stroke-width="2"/>
                    <rect x="15" y="5" width="20" height="4" fill="#F59E0B" rx="1"/>
                    <ellipse cx="25" cy="27" rx="20" ry="18" fill="#EF4444"/>
                    <path d="M 25 9 Q 15 27 25 45" stroke="#B91C1C" stroke-width="1.5" fill="none"/>
                    <path d="M 25 9 Q 35 27 25 45" stroke="#B91C1C" stroke-width="1.5" fill="none"/>
                    <rect x="15" y="45" width="20" height="4" fill="#F59E0B" rx="1"/>
                    <line x1="25" y1="49" x2="25" y2="65" stroke="#FBBF24" stroke-width="2"/>
                    <line x1="20" y1="49" x2="15" y2="60" stroke="#FBBF24" stroke-width="1.5"/>
                    <line x1="30" y1="49" x2="35" y2="60" stroke="#FBBF24" stroke-width="1.5"/>
                </svg>
            `;
            for (let i = 0; i < 25; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'lantern-container';
                wrapper.style.left = `${Math.random() * 90 + 5}vw`; // Tránh sát lề quá
                wrapper.style.setProperty('--float-duration', `${Math.random() * 25 + 20}s`);
                wrapper.style.animationDelay = `${Math.random() * 30}s`;
                
                const swayDiv = document.createElement('div');
                swayDiv.className = 'lantern-sway';
                swayDiv.innerHTML = lanternSVG;
                swayDiv.style.setProperty('--sway-duration', `${Math.random() * 2.5 + 2}s`);
                swayDiv.style.setProperty('--scale', Math.random() * 0.5 + 0.6);
                
                wrapper.appendChild(swayDiv);
                lanternsContainer.appendChild(wrapper);
            }

            const textData = [
                "Trăng kia lúc khuyết lúc tròn,<br>Tình anh vẫn mãi sắt son một màu.<br>Trung thu dẫu có qua mau,<br>Thương em anh nguyện trước sau vẹn toàn.",
                "Nếu tình yêu của chúng ta là một hệ phương trình, thì em chắc chắn là nghiệm số duy nhất khiến mọi định lý của anh đều trở nên đúng đắn. Người ta bảo hai đường thẳng song song sẽ chẳng bao giờ cắt nhau, nhưng anh tin rằng trong không gian phi Euclid của tình yêu, hai quỹ đạo của chúng ta đã va chạm và hòa quyện mãi mãi. Không có một giới hạn (limit) nào cho nỗi nhớ anh dành cho em khi tiến tới vô cực...",
                "Đêm rằm tháng Tám sáng trong,<br>Anh ngồi anh nhớ bóng hồng đời anh.<br>Trời cao lấp lánh sao mây,<br>Trong tim anh chỉ ngập đầy bóng em.",
                "Xét về mặt Vật lý lượng tử, sự gắn kết giữa hai hạt cơ bản cũng không thể mạnh mẽ bằng lực hấp dẫn mà em tạo ra đối với trái tim anh. Newton tìm ra trọng lực khi quả táo rơi trúng đầu, còn anh tìm ra chân lý cuộc đời khi ánh mắt em vô tình va phải anh. Mọi định luật bảo toàn năng lượng đều vô nghĩa, vì năng lượng tình yêu anh dành cho em là tự sinh ra và không bao giờ mất đi.",
                "Em biết không, trái tim anh vốn là một chất trơ, lạnh lẽo và không phản ứng với bất kỳ dung môi nào của cuộc đời. Cho đến khi em xuất hiện, em như một chất xúc tác hoàn hảo, phá vỡ mọi liên kết bền vững nhất trong anh, tạo ra một phản ứng tỏa nhiệt dữ dội mang tên 'Tình Yêu'. Phản ứng này không sinh ra khí độc, không có kết tủa, mà chỉ tạo ra một hợp chất ngọt ngào duy nhất kết tinh thành nụ cười của em.",
                "Theo triết học, mọi sự vật hiện tượng đều vận động và phát triển không ngừng. Nhưng tình cảm anh dành cho em lại là một nghịch lý vĩ đại: Nó vừa mang tính ổn định tuyệt đối, lại vừa phát triển liên tục về mặt lượng và biến đổi sâu sắc về mặt chất. Em là cái 'Tất nhiên' đẹp đẽ nhất xuất hiện trong vô vàn cái 'Ngẫu nhiên' của cuộc đời anh.",
                "Trung thu trăng sáng như gương,<br>Nhớ em anh mải vấn vương trong lòng.<br>Trời thu mây trắng bềnh bồng,<br>Thương em anh nguyện một lòng sắc son.",
                "Mùa thu có hương hoa sữa làm người ta xao xuyến, nhưng với anh, sự xao xuyến thực sự chỉ đến từ ánh mắt em. Trung thu người ta ngắm trăng, còn anh chỉ muốn ngắm nhìn khuôn mặt em, bởi trăng dẫu có sáng cũng không thể sưởi ấm trái tim anh như cách em đã làm. Em là bài thơ hay nhất mà anh dùng cả đời để đọc, là cuốn tiểu thuyết anh chẳng bao giờ muốn lật tới trang cuối cùng...",
                "Người ta thường nói: 'Trăng đến rằm trăng tròn, sao đến tháng sao sáng'. Còn anh thì lại thấy: 'Anh gặp em anh say, tim anh đập anh hay'. Trung thu này anh không cần bánh nướng bánh dẻo, vì sự ngọt ngào của em đã làm anh no nê cả tâm hồn."
            ];

            const modalContent = document.getElementById('modal-content');
            const container = document.getElementById('infinite-scroll-container');
            const wordCounterSpan = document.getElementById('word-counter');
            
            const TARGET_WORDS = 20000;
            let currentWordCount = 0;
            let isGenerating = false;
            let isFinished = false;

            // Hàm đếm chữ bỏ qua thẻ HTML
            const countWords = (str) => {
                const cleanStr = str.replace(/<[^>]*>?/gm, ' ');
                return cleanStr.split(/\s+/).filter(word => word.length > 0).length;
            };

            // Hàm append nội dung
            const loadMoreParagraphs = () => {
                if (isFinished || isGenerating) return;
                isGenerating = true;

                setTimeout(() => {
                    const fragment = document.createDocumentFragment();
                    let chunksAdded = 0;

                    // Mỗi lần load thêm 4-5 đoạn để giữ hiệu năng
                    while (chunksAdded < 4 && currentWordCount < TARGET_WORDS) {
                        const randomText = textData[Math.floor(Math.random() * textData.length)];
                        const wordsInText = countWords(randomText);
                        
                        const div = document.createElement('div');
                        div.className = 'fade-in-up';

                        // Xử lý Giao diện: Tách biệt Thơ và Văn xuôi
                        const isPoem = randomText.includes('<br>');
                        if (isPoem) {
                            // Style cho Thơ: Căn giữa, font chữ viết tay, màu vàng neon
                            div.className += ' text-center font-dancing text-2xl md:text-4xl leading-relaxed neon-poem py-4';
                            div.innerHTML = randomText;
                        } else {
                            // Style cho Văn xuôi: Căn đều, font hiện đại, màu hồng neon, chữ to vừa phải
                            div.className += ' text-justify font-quicksand text-lg md:text-xl leading-loose neon-essay tracking-wide bg-white/5 p-6 rounded-2xl border border-white/10 shadow-[0_4px_30px_rgba(0,0,0,0.1)] backdrop-blur-sm';
                            div.innerHTML = `<p>${randomText}</p>`;
                        }
                        
                        fragment.appendChild(div);
                        currentWordCount += wordsInText;
                        chunksAdded++;
                    }

                    container.appendChild(fragment);
                    
                    // Cập nhật giao diện đếm chữ (tránh vượt qua 20000)
                    wordCounterSpan.innerText = Math.min(currentWordCount, TARGET_WORDS).toLocaleString();

                    if (currentWordCount >= TARGET_WORDS) {
                        isFinished = true;
                        
                        const finalBox = document.createElement('div');
                        finalBox.className = 'flash-neon-box mt-20 mb-32 p-8 md:p-16 rounded-3xl text-center transform scale-105';
                        finalBox.innerHTML = `
                            <h2 class="font-quicksand font-bold text-3xl md:text-5xl leading-tight uppercase flash-neon-text">
                                CHÚC MỪNG EM ĐÃ ĐỌC HẾT!<br><br>
                                CẢM ƠN EM VÌ ĐÃ KIÊN NHẪN, TRUNG THU NÀY ANH YÊU EM NHẤT!<br><br>
                                MAI ANH ĐỀN 10 CỐC TRÀ SỮA ĐỂ BÙ ĐẮP NGÓN TAY NHÉ! ❤️
                            </h2>
                        `;
                        container.appendChild(finalBox);
                    }

                    isGenerating = false;
                }, 150); // Delay nhẹ tạo cảm giác mượt mà
            };

            // Lắng nghe sự kiện cuộn
            modalContent.addEventListener('scroll', () => {
                if (isFinished) return;
                const { scrollTop, scrollHeight, clientHeight } = modalContent;
                // Kích hoạt load thêm khi cách đáy 300px
                if (scrollTop + clientHeight >= scrollHeight - 300) {
                    loadMoreParagraphs();
                }
            });

            const welcomeScreen = document.getElementById('welcome-screen');
            const loveModal = document.getElementById('love-modal');
            const bgMusic = document.getElementById('bgMusic');
            const theMoon = document.getElementById('the-moon');

            theMoon.addEventListener('click', () => {
                // Kích hoạt âm thanh
                bgMusic.play().catch(e => console.log("Autoplay bị chặn", e));

                // Fade out màn hình chào
                welcomeScreen.style.opacity = '0';
                
                setTimeout(() => {
                    welcomeScreen.classList.add('hidden');
                    
                    // Hiện Modal
                    loveModal.classList.remove('hidden');
                    loveModal.classList.add('flex');
                    
                    // Nạp chữ đợt đầu tiên
                    loadMoreParagraphs();
                    setTimeout(loadMoreParagraphs, 300); // Nạp thêm để lấp đầy màn hình tạo thanh cuộn
                }, 800);
            });
        });
    </script>
</body>
</html>
